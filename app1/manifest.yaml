apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
# these labels are replicaset labels
  labels:
    project: roboshop
    purpose: rs-demo
    tier: frontend
    component: app1
  annotations:
    kubernetes.io/change-cause: "moving to 1.29"
spec:
  replicas: 2
  selector:
   # using these labels replica set selects the pod
    matchLabels:
      project: roboshop
      purpose: rs-demo
      tier: frontend
      component: app1
  # This is pod definition, pod is subset of replicaset
  template:
    metadata:
      labels:
        project: roboshop
        purpose: rs-demo
        tier: frontend
        component: app1
    spec:
      containers:
      - name: app1
        image: mskumarmadhavarapu/app1:1.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: app1
spec:
  selector:
    # labels are used as selectors
    project: roboshop
    component: app1
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port